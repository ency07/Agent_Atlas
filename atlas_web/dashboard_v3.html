<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas — Núcleo Vivo</title>
<style>
:root{
  --bg:linear-gradient(#060b16,#0a1424);
  --glass:rgba(140,190,255,.07);
  --line:rgba(140,200,255,.22);
  --neon:#59c8ff;--cyan:#5ad7ff;--txt:#eaf6ff;--dim:#8fb3cc;
  --warn:#ffc857;--fail:#ff5d5d;--ok:#5cf0c8;--r:14px;
  --glow:0 0 24px rgba(90,180,255,.10),inset 0 1px 0 rgba(255,255,255,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;color:var(--txt);font-size:13px}
body{background:var(--bg)}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 30% 20%,rgba(90,180,255,.06),transparent),radial-gradient(ellipse 50% 50% at 75% 70%,rgba(140,100,255,.05),transparent);z-index:-1}
#app{display:grid;height:100vh;width:100vw;grid-template-columns:280px 1fr 280px;grid-template-rows:48px 1fr 100px;grid-template-areas:"top top top" "izq centro der" "bottom bottom bottom";gap:6px;padding:6px}
#top{z-index:10}
.p{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--glow);padding:10px;overflow:hidden;transition:all .3s}
.p-alpha{background:rgba(140,190,255,.04);backdrop-filter:none}
.err{color:var(--fail);font-size:10px;opacity:.85}
.pt{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin-bottom:6px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.pt .exp{font-size:11px;cursor:pointer;opacity:.5;transition:opacity .2s}.pt .exp:hover{opacity:1}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:600;padding:1px 6px;border-radius:10px}
.badge-ok{background:rgba(92,240,200,.12);color:var(--ok)}.badge-warn{background:rgba(255,200,87,.12);color:var(--warn)}
.badge-fail{background:rgba(255,93,93,.12);color:var(--fail)}

/* TOPBAR */
#top{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 14px}
.clk{font-size:15px;font-weight:700;color:var(--neon);min-width:160px}
.ig{display:flex;gap:6px;align-items:center;flex:1;flex-wrap:wrap}
.is{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--dim);white-space:nowrap}
.is .d{width:5px;height:5px;border-radius:50%;background:var(--ok)}
.is.w .d{background:var(--warn)}.is.f .d{background:var(--fail)}
#sp{font-size:10px;font-weight:700;border:1px solid var(--line);border-radius:12px;padding:2px 8px}

/* LEFT */
#izq{grid-area:izq;display:grid;grid-template-rows:auto auto 1fr;gap:6px;overflow-y:auto}
.hi{font-size:16px;font-weight:700}.sub{font-size:10px;color:var(--dim);margin-top:2px}
.sub b{color:var(--neon)}

/* CLIMA */
.clime-act{display:flex;align-items:flex-start;gap:6px}
.clime-icon{font-size:24px;line-height:1}
.temp{font-size:26px;font-weight:700;color:var(--neon);line-height:1}
.clim-info{font-size:10px;color:var(--dim);line-height:1.4}
.fc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:6px}
.fc-day{text-align:center;font-size:8px;color:var(--dim);padding:3px 0;border-radius:4px;background:rgba(140,190,255,.04)}
.fc-day .dt{color:var(--txt);font-size:10px;font-weight:600}
.city-row{display:flex;gap:3px;margin-top:4px}
.city-row input{flex:1;background:rgba(140,190,255,.06);border:1px solid var(--line);color:var(--txt);padding:3px 6px;border-radius:4px;font-size:10px}
.city-row button{background:var(--neon);border:none;color:#04070d;padding:3px 8px;border-radius:4px;font-size:9px;font-weight:700;cursor:pointer}

/* BARS */
.bars{display:flex;flex-direction:column;gap:4px}
.bar{height:4px;background:rgba(140,200,255,.08);border-radius:2px;overflow:hidden}
.bar .f{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--neon));transition:width .6s}
.bl{display:flex;justify-content:space-between;font-size:9px;color:var(--dim);margin-bottom:1px}

/* CENTER */
#centro{grid-area:centro;position:relative}
#sphere{width:100%;height:100%;border-radius:var(--r);cursor:pointer}

/* RIGHT */
#der{grid-area:der;display:grid;grid-template-rows:auto 1fr auto;gap:6px;overflow-y:auto}
/* Chips V2 */
.chips{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.chip{font-size:10px;padding:4px 8px;border-radius:8px;background:rgba(140,190,255,.05);border:1px solid var(--line);display:flex;align-items:center;gap:4px;cursor:default}
.chip .cd{width:5px;height:5px;border-radius:50%;background:var(--ok);flex-shrink:0}
.chip .cd.w{background:var(--warn)}.chip .cd.f{background:var(--fail)}
.chip .cl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim);font-size:9px}
.feed{display:flex;flex-direction:column;gap:3px;overflow-y:auto;max-height:100%}
.fi{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);padding:3px 6px;border-radius:6px;background:rgba(140,190,255,.04);border-left:2px solid var(--line)}
.fi .ic{font-size:11px;flex-shrink:0}.fi.ok .ic{color:var(--ok)}.fi.ok{border-left-color:var(--ok)}
.fi.busy .ic{color:var(--warn)}.fi.busy{border-left-color:var(--warn)}
.fi.err .ic{color:var(--fail)}.fi.err{border-left-color:var(--fail)}
.fi .st{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi .tm{font-size:9px;opacity:.7;flex-shrink:0}
.fi a,.fi a:visited{color:var(--neon);text-decoration:none;cursor:pointer}.fi a:hover{text-decoration:underline}

/* BOTTOM */
#bottom{grid-area:bottom;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;overflow:hidden}
#bottom .p{padding:8px}
.qm-row{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
.qm-btn{background:rgba(90,180,255,.08);border:1px solid var(--line);color:var(--neon);padding:4px 8px;border-radius:8px;font-size:10px;font-weight:600;cursor:pointer;transition:all .15s;text-align:center}
.qm-btn:hover{background:rgba(90,180,255,.18);box-shadow:0 0 8px rgba(89,200,255,.3)}
#orden{display:flex;gap:4px}
#orden select{background:rgba(140,190,255,.06);border:1px solid var(--line);color:var(--txt);padding:4px;border-radius:4px;font-size:11px}
#o-input{flex:1;background:rgba(140,190,255,.06);border:1px solid var(--line);color:var(--txt);padding:4px 8px;border-radius:4px;font-size:12px}
#o-input:focus{outline:none;border-color:var(--neon)}
#o-btn{background:linear-gradient(135deg,var(--cyan),var(--neon));border:none;color:#04070d;font-size:11px;font-weight:700;padding:4px 10px;border-radius:4px;cursor:pointer}
#wave canvas{width:100%;height:40px}

/* CONVERSATION PANEL */
#chat-panel{position:fixed;top:0;right:-420px;width:420px;height:100vh;background:linear-gradient(#0a1424,#060b16);border-left:1px solid var(--neon);z-index:9999;transition:right .3s;display:flex;flex-direction:column;box-shadow:-4px 0 20px rgba(89,200,255,.15)}
#chat-panel.open{right:0}
#chat-header{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
#chat-header h3{font-size:12px;color:var(--neon)}
#chat-close{background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer}
#chat-close:hover{color:var(--fail)}
#chat-body{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.chat-msg{padding:8px 10px;border-radius:10px;font-size:11px;line-height:1.5;max-width:90%}
.chat-msg.user{background:rgba(90,180,255,.12);border:1px solid var(--line);align-self:flex-end;color:var(--txt)}
.chat-msg.assistant{background:rgba(140,190,255,.05);border:1px solid rgba(140,190,255,.1);align-self:flex-start;color:var(--dim)}
.chat-msg .meta{font-size:9px;color:var(--dim);margin-top:4px;opacity:.6}
.chat-msg a{color:var(--neon)}.chat-msg a:hover{text-decoration:underline}

/* PREVIEW→EXPAND OVERLAY */
#expand-overlay{display:none;position:fixed;inset:0;z-index:9998;background:rgba(4,7,13,.75);align-items:center;justify-content:center}
#expand-overlay.show{display:flex}
.exp-content{background:linear-gradient(#0a1424,#060b16);border:1px solid var(--neon);border-radius:16px;padding:16px;width:90%;max-width:600px;max-height:80vh;overflow-y:auto;position:relative}
.exp-content .exp-close{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer}
.exp-content .exp-close:hover{color:var(--fail)}
.exp-content h3{font-size:13px;color:var(--neon);margin-bottom:10px}

/* DINERO EXPAND */
.din-row{display:flex;align-items:center;gap:8px;padding:6px;border-bottom:1px solid var(--line);font-size:11px}
.din-row:last-child{border-bottom:none}
.din-name{flex:1;font-weight:600}.din-val{color:var(--neon);font-weight:700;min-width:80px;text-align:right}
.din-change{font-size:10px;min-width:60px;text-align:right}
.din-del{background:none;border:none;color:var(--fail);cursor:pointer;font-size:12px;padding:2px 6px;border-radius:4px}
.din-del:hover{background:rgba(255,93,93,.15)}
.add-row{display:flex;gap:4px;margin-top:8px}
.add-row input{flex:1;background:rgba(140,190,255,.06);border:1px solid var(--line);color:var(--txt);padding:4px 8px;border-radius:4px;font-size:11px}
.add-row button{background:var(--ok);border:none;color:#04070d;padding:4px 10px;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer}

/* NOTICIAS EXPAND */
.not-item{padding:6px;border-bottom:1px solid var(--line);font-size:11px;cursor:pointer}
.not-item:hover{background:rgba(140,190,255,.04)}
.not-item:last-child{border-bottom:none}
.not-item .title{color:var(--txt);font-weight:600;text-decoration:none;display:block}
.not-item .title:hover{color:var(--neon)}
.not-item .pub{font-size:9px;color:var(--dim);margin-top:2px}
.not-item .sum{font-size:10px;color:var(--dim);margin-top:2px;line-height:1.4}

/* CONFIG PANEL */
.cfg-section{margin-bottom:12px}
.cfg-section h4{font-size:10px;color:var(--neon);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.cfg-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:10px;color:var(--dim)}
.cfg-row input,.cfg-row select{background:rgba(140,190,255,.06);border:1px solid var(--line);color:var(--txt);padding:3px 6px;border-radius:4px;font-size:10px}
.cfg-row button{padding:2px 8px;border-radius:4px;font-size:9px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:rgba(140,190,255,.06);color:var(--neon)}
.cfg-row button:hover{background:rgba(90,180,255,.15)}
.cfg-row button.danger{color:var(--fail);border-color:rgba(255,93,93,.3)}

/* ONBOARDING */
#onboard{display:none;position:fixed;inset:0;z-index:9999;background:rgba(4,7,13,.8);align-items:center;justify-content:center}
#onboard.show{display:flex}
.ob-box{background:linear-gradient(#0a1424,#060b16);border:1px solid var(--neon);border-radius:16px;padding:20px;width:340px;text-align:center}
.ob-box h2{font-size:16px;color:var(--neon);margin-bottom:6px}
.ob-box label{display:block;font-size:10px;color:var(--dim);text-align:left;margin:8px 0 2px}
.ob-box input{width:100%;background:rgba(140,190,255,.06);border:1px solid var(--line);color:var(--txt);padding:6px;border-radius:6px;font-size:12px}
.ob-box input:focus{outline:none;border-color:var(--neon)}
.ob-box button{background:linear-gradient(135deg,var(--cyan),var(--neon));border:none;color:#04070d;font-size:12px;font-weight:700;padding:8px;border-radius:8px;cursor:pointer;width:100%;margin-top:8px}
#ob-err{color:var(--fail);font-size:10px;display:none}
@keyframes blink{50%{opacity:.3}}
</style>
</head>
<body>

<!-- ERR BADGE -->
<div id="err-badge" style="display:none;position:fixed;top:6px;right:6px;padding:4px 10px;border-radius:8px;font-size:10px;font-weight:700;z-index:99999"></div>

<!-- CHAT PANEL -->
<div id="chat-panel">
  <div id="chat-header">
    <h3>💬 Conversación</h3>
    <button id="chat-close" data-action="chat-close">×</button>
  </div>
  <div id="chat-body"></div>
  <div style="padding:8px;border-top:1px solid var(--line);display:flex;gap:4px">
    <input id="chat-input" placeholder="Escribe una pregunta…" style="flex:1;background:rgba(140,190,255,.06);border:1px solid var(--line);color:var(--txt);padding:6px 8px;border-radius:6px;font-size:12px" />
    <button id="chat-send" data-action="chat-send" style="background:var(--neon);border:none;color:#04070d;padding:6px 12px;border-radius:6px;font-weight:700;cursor:pointer">→</button>
  </div>
</div>

<!-- EXPAND OVERLAY -->
<div id="expand-overlay" onclick="if(event.target===this)closeExpand()">
  <div class="exp-content" id="exp-content"></div>
</div>

<div id="app">

  <div id="top" class="p">
    <div class="clk" id="clock">--:--:--</div>
    <div id="sp"><span id="pill-st">IDLE</span></div>
    <div class="ig">
      <div class="is" id="is-health"><div class="d"></div><span>—</span></div>
      <div class="is" id="is-daemon"><div class="d"></div><span>daemon</span></div>
      <div class="is" id="is-prov"><div class="d"></div><span>providers</span></div>
      <div class="is" id="is-model"><div class="d"></div><span>modelo</span></div>
    </div>
    <button data-action="config" style="background:var(--glass);border:1px solid var(--line);color:var(--dim);border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:14px" title="Configuración">⚙</button>
    <button data-action="chat" style="background:var(--glass);border:1px solid var(--line);color:var(--dim);border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:14px" title="Conversación">💬</button>
  </div>

  <div id="izq">
    <div class="p"><div class="pt"><span>Saludo</span></div><div class="hi" id="g-hi">Hola</div><div class="sub" id="g-sub"></div></div>
    <div class="p" id="clima-panel" style="cursor:pointer" data-expand="clima">
      <div class="pt"><span>Clima</span><span class="exp">↗</span></div>
      <div id="clima-body"><div class="err">cargando…</div></div>
    </div>
    <div class="p" id="sistema-panel" style="cursor:pointer" data-expand="sistema">
      <div class="pt"><span>Sistema</span><span class="exp">↗</span></div>
      <div class="bars">
        <div class="bl"><span>CPU</span><span id="v-cpu">—</span></div><div class="bar"><div class="f" id="f-cpu" style="width:0%"></div></div>
        <div class="bl"><span>RAM</span><span id="v-ram">—</span></div><div class="bar"><div class="f" id="f-ram" style="width:0%"></div></div>
        <div class="bl"><span>Disco</span><span id="v-disk">—</span></div><div class="bar"><div class="f" id="f-disk" style="width:0%"></div></div>
        <div class="bl"><span>Latencia</span><span id="v-lat">—</span></div><div class="bar"><div class="f" id="f-lat" style="width:0%"></div></div>
      </div>
      <button id="btn-resume" style="display:none;background:var(--warn);border:none;color:#000;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;margin-top:4px" data-action="resume">▶ Reanudar daemon</button>
    </div>
  </div>

  <div id="centro" class="p">
    <canvas id="sphere"></canvas>
    <div style="position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--dim);opacity:.5">click → módulos</div>
  </div>

  <div id="der">
    <div class="p" id="agenda-panel" style="cursor:pointer" data-expand="agenda">
      <div class="pt"><span>Agenda</span><span class="exp">↗</span></div>
      <div id="cal-body"><div class="err">cargando…</div></div>
    </div>
    <div class="p" id="mc-panel">
      <div class="pt"><span>Mission Control</span></div>
      <div class="feed" id="mc-feed"><div class="err">cargando…</div></div>
    </div>
    <div class="p">
      <div class="chips">
        <div class="chip" id="chip-sec"><div class="cd"></div><div class="cl" id="chip-sec-t">SECURE</div></div>
        <div class="chip" id="chip-voz"><div class="cd"></div><div class="cl" id="chip-voz-t">VOZ IDLE</div></div>
      </div>
      <div style="margin-top:6px">
        <div class="pt"><span>Actividad</span></div>
        <div id="auto-body"><div class="err">cargando…</div></div>
      </div>
    </div>
  </div>

  <div id="bottom">
    <div class="p" style="cursor:pointer" data-expand="dinero">
      <div class="pt"><span>Mercado</span><span class="exp">↗</span></div>
      <div id="mercado-preview"><div class="err">cargando…</div></div>
    </div>
    <div class="p">
      <div class="pt"><span>Órdenes</span></div>
      <div id="orden">
        <select id="o-level"><option value="L0">L0</option><option value="L1">L1</option><option value="L2">L2</option></select>
        <input id="o-input" placeholder="Escribe tu orden…" />
        <button id="o-btn" data-action="send-order">Enviar</button>
      </div>
      <div id="chat-resultado" style="margin-top:4px;font-size:10px;color:var(--dim);max-height:30px;overflow:hidden"></div>
    </div>
    <div class="p" style="cursor:pointer" data-expand="noticias">
      <div class="pt"><span>Noticias</span><span class="exp">↗</span></div>
      <div id="noticias-preview"><div class="err">cargando…</div></div>
    </div>
  </div>

</div>

<script>
(function(){
  'use strict';
  var $id=function(id){return document.getElementById(id)};
  var ERR_T=null;
  function setErr(type,msg){
    var b=$id('err-badge');if(!b)return;
    b.className=type==='js'?'':'';
    b.style.display='block';b.style.background=type==='js'?'var(--fail)':'var(--warn)';b.style.color=type==='js'?'#fff':'#000';
    b.textContent=type==='js'?'BUG: '+msg:'API: '+msg;
    clearTimeout(ERR_T);ERR_T=setTimeout(function(){b.style.display='none'},8000);
  }
  window.onerror=function(m,s,l){setErr('js',(m||'?')+' ('+(s?s.split('/').pop():'?')+':'+l+')');return true};
  function p2(n){return n<10?'0'+n:''+n}
  function esc(s){return(s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

  tick();setInterval(tick,1000);
  function tick(){var d=new Date();$id('clock').textContent=p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())}

  function sf(url,cb,opts,timeout){
    var ctrl=null,tid=null;
    try{ctrl=new AbortController()}catch(e){}
    var fetchOpts=opts||{};if(ctrl)fetchOpts.signal=ctrl.signal;
    fetch(url,fetchOpts).then(function(r){return r.json()}).then(function(d){if(tid)clearTimeout(tid);cb(d,null)}).catch(function(e){if(tid)clearTimeout(tid);cb(null,e&&e.message||String(e))});
    tid=setTimeout(function(){if(ctrl)try{ctrl.abort()}catch(e){}cb(null,'timeout')},timeout||6000);
  }

  // CHAT PANEL
  window.toggleChat=function(open){$id('chat-panel').classList.toggle('show',open)};
  $id('chat-input').onkeydown=function(e){if(e.key==='Enter')sendChat()};

  function sendChat(){
    var txt=($id('chat-input').value||'').trim();if(!txt)return;
    $id('chat-input').value='';
    addChatMsg(txt,'user');
    sf('/api/chat',function(d,e){
      if(e){addChatMsg('⚠ Error: '+e,'assistant');return}
      if(d.ok){
        var r=d.preview?'Nivel '+d.nivel+' — contract: '+JSON.stringify(d.preview).slice(0,80):'Orden '+d.order_id+' ('+d.nivel+') procesando…';
        addChatMsg(r,'assistant');
        if(d.order_id)pollOrder(d.order_id);
      }else{addChatMsg('⚠ '+d.error,'assistant')}
    },{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({texto:txt,prioridad:'normal'})},15000);
  }
  function pollOrder(order_id){
    setTimeout(function(){
      sf('/api/orden/'+order_id,function(d,e){
        if(e||!d)return;
        if(d.estado==='TERMINADA'){
          var res=d.result||'completado';
          addChatMsg('✅ Orden completada: '+esc(typeof res==='string'?res.slice(0,200):JSON.stringify(res).slice(0,200)),'assistant');
        }else if(d.estado==='ESCALADA'){
          addChatMsg('⚠ Orden escalada — requiere aprobación','assistant');
        }else if(d.estado!=='PENDIENTE'){
          addChatMsg('ℹ Estado: '+d.estado,'assistant');
        }
        if(d.estado==='PENDIENTE'||d.estado==='PROCESANDO')pollOrder(order_id);
      },{},5000);
    },2000);
  }
  function addChatMsg(text,cls){
    var b=$id('chat-body');
    var d=document.createElement('div');d.className='chat-msg '+cls;d.textContent=text;
    b.appendChild(d);b.scrollTop=b.scrollHeight;
  }

  // ONBOARDING

  // ESFERA V8
  var canvas=$id('sphere'),ctx=canvas.getContext('2d'),particles=[],P_COUNT=600,rotX=0,rotY=0.3,ripples=[];
  function initP(){particles=[];for(var i=0;i<P_COUNT;i++){var t=Math.acos(-1+2*i/P_COUNT),p=Math.sqrt(P_COUNT*Math.PI)*t;particles.push({x:Math.sin(t)*Math.cos(p),y:Math.sin(t)*Math.sin(p),z:Math.cos(t),s:Math.random()*1.2+.4})}}
  initP();
  function resC(){var r=canvas.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,1.5);canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}
  function rgbTo(h){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];var n=parseInt(h,16);return(n>>16)+','+((n>>8)&255)+','+(n&255)}
  function drawSphere(){
    if(document.hidden){requestAnimationFrame(drawSphere);return}
    var r=canvas.getBoundingClientRect(),w=r.width,h=r.height,cx=w/2,cy=h/2,rad=Math.max(w,h)*.55;
    if(rad<20)rad=20;ctx.clearRect(0,0,w,h);
    var speedMul=Math.max(.3,Math.min(3,actionsPerMin/30)),pulse=1+Math.sin(Date.now()*.002)*.04;
    rotY+=.0015*speedMul;rotX+=.00045;
    var cosX=Math.cos(rotX),sinX=Math.sin(rotX),cosY=Math.cos(rotY),sinY=Math.sin(rotY);
    for(var i=0;i<P_COUNT;i++){
      var pt=particles[i];if(!pt)continue;
      var x=pt.x*pulse,y=pt.y*pulse,z=pt.z*pulse;
      var y1=y*cosX-z*sinX,z1=y*sinX+z*cosX,x1=x*cosY+z1*sinY,z2=-x*sinY+z1*cosY;
      var scale=1/(2.5+(-z2)),px=cx+x1*rad*scale,py=cy+y1*rad*scale;
      var alpha=(z2+1)/2*.85+.15,sz=pt.s*(1+scale*.5);
      ctx.fillStyle='rgba('+rgbTo(healthColor)+','+alpha.toFixed(2)+')';
      ctx.beginPath();ctx.arc(px,py,sz,0,Math.PI*2);ctx.fill();
    }
    ctx.strokeStyle='rgba('+rgbTo(healthColor)+',.15)';ctx.lineWidth=1;
    [.85,1,1.15].forEach(function(s){ctx.beginPath();ctx.ellipse(cx,cy,rad*s,rad*s*.35,0,0,Math.PI*2);ctx.stroke()});
    var grad=ctx.createRadialGradient(cx,cy,rad*.6,cx,cy,rad*1.2);grad.addColorStop(0,'rgba('+rgbTo(healthColor)+',.06)');grad.addColorStop(1,'rgba('+rgbTo(healthColor)+',0)');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
    var grad2=ctx.createRadialGradient(cx-rad*.3,cy+rad*.2,0,cx-rad*.3,cy+rad*.2,rad*.8);grad2.addColorStop(0,'rgba(140,100,255,.04)');grad2.addColorStop(1,'rgba(140,100,255,0)');ctx.fillStyle=grad2;ctx.fillRect(0,0,w,h);
    for(var j=ripples.length-1;j>=0;j--){var rp=ripples[j];rp.r+=1.5;rp.life-=.012;if(rp.life<=0){ripples.splice(j,1);continue}ctx.strokeStyle='rgba('+rgbTo(healthColor)+','+(rp.life*.4).toFixed(2)+')';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,rp.r,0,Math.PI*2);ctx.stroke()}

  }

  };
  window.saveConfigProfile=function(){
    var nm=($id('cfg-nm').value||'').trim(),ct=($id('cfg-ct').value||'').trim();
    sf('/api/preferences',function(){},{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_name:nm,ciudad:ct})});
    user_name=nm;ciudad=ct;$id('g-hi').textContent='Hola, '+nm;closeExpand();
  };
  window.addCfgAsset=function(){var a=($id('cfg-asset').value||'').trim();if(!a)return;sf('/api/mercado/watchlist',function(){openConfig()},{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'add',asset:a})})};
  window.removeCfgAsset=function(a){sf('/api/mercado/watchlist',function(){openConfig()},{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'remove',asset:a})})};
  window.addCfgRSS=function(){var u=($id('cfg-rss').value||'').trim();if(!u)return;sf('/api/noticias/sources',function(){openConfig()},{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'add',url:u})})};
  window.removeCfgRSS=function(u){sf('/api/noticias/sources',function(){openConfig()},{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'remove',url:u})})};
  window.closeExpand=function(){$id('expand-overlay').classList.remove('show')};
  document.onkeydown=function(e){if(e.key==='Escape'){closeExpand();toggleChat(false)}};

  // MISSION CONTROL
  function loadMC(){
    sf('/api/live',function(d,e){
      if(e)return;
      var tasks=(d||{}).tasks||[],h='';
      tasks.slice(0,6).forEach(function(t){
        var icon,cls;
        if(t.heartbeat_status==='done'){icon='✓';cls='ok'}else if(t.heartbeat_status==='red'){icon='✗';cls='err'}else{icon='→';cls='busy'}
        h+='<div class="fi '+cls+'"><span class="ic">'+icon+'</span><span class="st">'+esc(t.task_id||'')+'</span><span class="tm">'+esc((t.last_beat||'').slice(11,16))+'</span></div>';
      });
      $id('mc-feed').innerHTML=h||'<div style="font-size:10px;color:var(--dim)">sin tareas activas</div>';
    });
  }

  // CHIPS
  function loadChips(){
    sf('/api/guardian',function(d,e){
      var t=$id('chip-sec-t'),dot=$id('chip-sec').querySelector('.cd');
      if(e||!d||!d.events||!d.events.length){dot.className='cd';t.innerHTML='<b>SECURE</b>';return}
      dot.className='cd w';t.innerHTML='<b>SECURITY</b> · '+d.events.length;
    });
    var vt=$id('chip-voz-t'),vd=$id('chip-voz').querySelector('.cd');
    if(cogState==='exec'){vd.className='cd w';vt.innerHTML='<b>VOZ</b> · PROCESANDO'}
    else if(cogState==='escal'){vd.className='cd f';vt.innerHTML='<b>VOZ</b> · ESCALADO'}
    else{vd.className='cd';vt.innerHTML='<b>VOZ</b> · IDLE'}
  }

  // AUTO ACTIVITY
  function loadAuto(){
    sf('/api/evals',function(d,e){
      var h='';
      if(!e&&d){(d.items||d.resultados||[]).slice(0,2).forEach(function(ev){h+='<div class="fi busy" style="font-size:10px"><span class="ic">📊</span><span class="st">'+esc(ev.nombre||ev.id||'')+'</span></div>'})}
      $id('auto-body').innerHTML=h||'<div style="font-size:10px;color:var(--dim)">sin actividad</div>';
    });
  }

  // FOCO
  function loadFoco(){
    sf('/api/foco',function(d,e){
      if(e)return;
      var fp=d.focus_pct!==undefined?Math.round(d.focus_pct):'—';
      var ta=d.productive_seconds?Math.round(d.productive_seconds/60):0;
      $id('g-sub').innerHTML='foco <b>'+fp+'%</b> · <b>'+ta+'</b> min productivos';
    });
  }

  // QUICK ACTIONS
  document.querySelectorAll('.qm-btn').forEach(function(btn){
    btn.onclick=function(){var l0=btn.getAttribute('data-l0');sf('/api/orden',function(){},{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({texto:l0,prioridad:'alta'})});addChatMsg('⚡ Orden "'+l0+'" enviada','assistant')};
  });

  // ORDER
  window.sendOrder=function(){
    var val=($id('o-input').value||'').trim();if(!val)return;
    var btn=$id('o-btn');btn.textContent='…';btn.disabled=true;
    sf('/api/chat',function(d,e){
      btn.textContent='Enviar';btn.disabled=false;
      if(!e&&d&&d.ok){$id('o-input').value='';$id('chat-resultado').innerHTML='✓ '+d.nivel+' · '+d.order_id;toggleChat(true);sendChatMsg(d.order_id,d)}
      else{$id('chat-resultado').innerHTML='⚠ Error'}
    },{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({texto:val,prioridad:$id('o-level').value==='L0'?'alta':'normal'})},15000);
  };
  function sendChatMsg(order_id,d){
    addChatMsg('📋 Orden enviada: '+(d.preview?JSON.stringify(d.preview).slice(0,120):d.nivel),'assistant');
    if(order_id)pollOrder(order_id);
  }

  // WAVEFORM
  var wvCtx=$id('wave-c')&&$id('wave-c').getContext?null:null;
  function wvAni(){
    if(document.hidden){requestAnimationFrame(wvAni);return}
    var wc=$id('wave-c');if(!wc){requestAnimationFrame(wvAni);return}
    var wr=wc.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,1.5);
    wc.width=wr.width*dpr;wc.height=40*dpr;
    var c=wc.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,wr.width,40);
    var now=Date.now()*.003,amp=Math.min(.9,actionsPerMin/40||.03);
    c.strokeStyle='#59c8ff';c.lineWidth=1.5;c.shadowBlur=6;c.shadowColor='#59c8ff';
    c.beginPath();
    for(var i=0;i<60;i++){var x=i*(wr.width/59),y=20+Math.sin(now+i*.3)*(amp*20)+Math.sin(now*3+i*.7)*(amp*8);if(i===0)c.moveTo(x,y);else c.lineTo(x,y)}
    c.stroke();requestAnimationFrame(wvAni);
  }

  // EVENT DELEGATION
  var EXPAND_MAP = {clima:expandClima,dinero:expandDinero,noticias:expandNoticias,agenda:expandAgenda,sistema:expandSistema};
  document.addEventListener('click',function(e){
    var t=e.target;
    // data-expand on panel
    var panel=t.closest('[data-expand]');
    if(panel){
      var fn=EXPAND_MAP[panel.getAttribute('data-expand')];
      if(fn)fn();
      return;
    }
    // data-action buttons
    var act=t.closest('[data-action]');
    if(act){
      var a=act.getAttribute('data-action');
      if(a==='config')openConfig();
      else if(a==='chat')toggleChat(true);
      else if(a==='chat-close')toggleChat(false);
      else if(a==='add-asset')addAsset();
      else if(a==='remove-asset')removeAsset(act.dataset.asset);
      else if(a==='add-rss')addRSS();
      else if(a==='remove-rss')removeRSS(act.dataset.url);
      else if(a==='save-city')saveCity();
      else if(a==='save-profile')saveConfigProfile();
      else if(a==='add-cfg-asset')addCfgAsset();
      else if(a==='remove-cfg-asset')removeCfgAsset(act.dataset.asset);
      else if(a==='add-cfg-rss')addCfgRSS();
      else if(a==='remove-cfg-rss')removeCfgRSS(act.dataset.url);
      else if(a==='resume')doResume(e);
      else if(a==='send-order')sendOrder();
      else if(a==='chat-send')sendChat();
      return;
    }
  });

  // ARRANQUE
  getProfile();loadLive();loadMC();
  setTimeout(function(){loadClima();loadSystem();loadFoco()},80);
  setTimeout(function(){loadMercado();loadNoticias();loadChips();loadAuto()},200);
  setTimeout(function(){loadAgenda()},400);
  setInterval(loadLive,4000);setInterval(loadSystem,15000);setInterval(loadMC,6000);
  setInterval(loadChips,5000);setInterval(loadMercado,30000);setInterval(loadNoticias,120000);
  setInterval(loadFoco,60000);
  setTimeout(startCanvas,200);setTimeout(function(){try{wvAni()}catch(e){}},400);

})();
</script>
</body>
</html>
