name: Atlas Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Ejecutar tests diariamente a las 03:00 UTC
    - cron: '0 3 * * *'

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install pytest pytest-asyncio
      
      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v --tb=short
      
      - name: Run integration test (setup validation)
        run: |
          python tests/setup-ps1-jsonc-validation.ps1

  chaos:
    runs-on: windows-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psutil
      
      - name: Start Atlas services
        run: |
          # Iniciar servicios en background
          Start-Process python -ArgumentList "mcp_memory_server.py" -WorkingDirectory "$(pwd)"
          Start-Process python -ArgumentList "atlas_web_server.py" -WorkingDirectory "$(pwd)"
          Start-Process python -ArgumentList "atlas_orchestrator.py" -WorkingDirectory "$(pwd)"
          Start-Sleep 10
      
      - name: Run chaos test
        run: |
          python tests/chaos.py --duration 120 --seed ${{ github.run_number }}
      
      - name: Verify recovery
        run: |
          # Verificar que todos los servicios siguen vivos
          python -c "
          import psutil
          for proc in psutil.process_iter(['pid', 'cmdline']):
              cmd = ' '.join(proc.info['cmdline'] or [])
              if any(x in cmd for x in ['mcp_memory_server', 'atlas_web_server', 'atlas_orchestrator']):
                  print(f'RUNNING: {cmd[:80]}')
          "

  verify-config:
    runs-on: windows-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Validate opencode.jsonc template
        run: |
          powershell -ExecutionPolicy Bypass -File tests/setup-ps1-jsonc-validation.ps1